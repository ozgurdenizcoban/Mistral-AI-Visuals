[build]
  command = "pnpm --filter @workspace/apextus build"
  publish = "artifacts/apextus/dist/public"
  functions = "artifacts/apextus/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PORT = "4173"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
